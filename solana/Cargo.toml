[package]
name = "ecvrf-solana"
version = "0.1.0"
edition = "2021"
description = "RFC 9381 ECVRF-EDWARDS25519-SHA512-TAI verify-only Solana on-chain program"
license = "MIT"
repository = "https://github.com/tikaydaes/ecvrf"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
curve25519-dalek = { version = "4", default-features = false }
sha2 = "0.10"
solana-program = "2"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
