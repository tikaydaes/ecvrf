name: ECVRF Cross-Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python oracle & vector drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd python && python3 ecvrf.py && python3 generate.py
      - run: git diff --exit-code vectors/vectors.json

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - working-directory: go
        run: go vet ./... && go test -v -count=1 ./...

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: js
        run: node --test ecvrf.test.js

  dart:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: dart
        run: dart pub get && dart analyze --fatal-infos && dart test

  cross-validate:
    name: Cross-implementation validation
    needs: [python, go, js, dart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: cd dart && dart pub get
      - run: bash scripts/cross-validate.sh
